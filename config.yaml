# twitter-account-collector 配置文件
# 说明：本文件驱动 scripts/collector.py 的真实运行逻辑（四层漏斗）。

# 跟踪账号列表（handle 不含 @）
accounts:
  - elonmusk
  - VitalikButerin

# 抓取与筛选参数
request_delay: 2.5          # 每次请求之间的平滑间隔（秒），用于降低频控风险
time_window_hours: 1        # 第一层：只采集该时间窗内发布的推文
min_chars: 15               # 第三层：短于此字数的内容视为低信息噪音
db_path: collector.db       # SQLite 去重库路径（自动创建）

# 第三层噪音关键词（命中且未命中价值词则过滤）
noise_keywords:
  - gm
  - gn
  - 早安
  - 晚安
  - 午安
  - 聚会
  - 下午茶
  - 哈哈
  - lol
  - 加油

# 第三层价值关键词（命中则视为值得关注）
value_keywords:
  - 融资
  - raise
  - funding
  - snapshot
  - 快照
  - 测试网
  - mainnet
  - 主网
  - 漏洞
  - exploit
  - 女巫
  - sybil
  - 空投
  - airdrop
  - 合约
  - 争议
  - 辩论
