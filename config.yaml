# twitter-account-collector 配置文件
# 说明：本文件驱动 scripts/collector.py 的通用消息抓取逻辑（时间窗 → 去重 → 噪音过滤 → 汇总）。

# 跟踪账号列表（handle 不含 @，任意公开账号均可，不绑定领域）
accounts:
  - twitter
  - BBCBreaking
  - NASA
  - TheVerge

# ── 抓取深度参数 ──
request_delay: 2.5            # 每次请求之间的平滑间隔（秒），降低频控风险
time_window_hours: 1          # 时间深度：只采集该时间窗内发布的推文（1~72 可调）
max_tweets_per_account: 20    # 条数深度：单次每账号最多处理条数，防止一次拉爆
include_replies: false        # 是否包含回复（默认不含）
include_retweets: false       # 是否包含转推（默认不含，转推按噪音过滤）
min_chars: 15                 # 噪音阈值：短于此字数的内容视为低信息噪音
db_path: collector.db         # SQLite 去重库路径（自动创建）

# 噪音关键词（命中且属短内容则过滤；通用，可按需增删）
noise_keywords:
  - gm
  - gn
  - 早安
  - 晚安
  - 午安
  - 聚会
  - 下午茶
  - 哈哈
  - lol
  - 打卡
  - 转发微博
